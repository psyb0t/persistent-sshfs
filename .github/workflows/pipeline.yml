name: pipeline

# persistent-sshfs is a standalone bash script, not a pushable image, so there
# is no docker-image build in CI. This pipeline exists solely to publish the
# skill(s) under .agents/skills/ to ClawHub on tag pushes.
on:
  push:
    tags:
      - "v*"

jobs:
  badges:
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master

  # Publish every skill under .agents/skills/ to ClawHub, one slug per subdir.
  publish-to-clawhub:
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
